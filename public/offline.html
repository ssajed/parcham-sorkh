<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c32">
  <title>اتصال اینترنت برقرار نیست | پرچم سرخ</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#17211d;font-family:Tahoma,Arial,sans-serif}.card{width:min(100%,460px);padding:32px;border:1px solid #e2e8f0;border-radius:24px;background:#fff;text-align:center;box-shadow:0 12px 40px #123c3210}.mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:#123c32;color:#fff;font-size:32px;font-weight:900}.line{height:4px;width:72px;margin:18px auto;background:#d62828;border-radius:9px}h1{margin:0;font-size:22px}p{color:#64748b;line-height:2;font-size:14px}button{margin-top:12px;border:0;border-radius:999px;padding:12px 24px;background:#123c32;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">پ</div>
    <h1>در حال حاضر آفلاین هستید</h1>
    <div class="line"></div>
    <p>برای استفاده از بخش‌های سامانه، اتصال اینترنت را بررسی کنید و دوباره تلاش کنید. اطلاعات حساب و درخواست‌های شما در حالت آفلاین ذخیره نمی‌شوند.</p>
    <button type="button" onclick="location.reload()">تلاش دوباره</button>
  </main>
</body>
</html>
